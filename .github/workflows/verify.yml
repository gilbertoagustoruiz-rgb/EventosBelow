name: Validación EventosBelow
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventos_test
          POSTGRES_PASSWORD: eventos_test
          POSTGRES_DB: eventos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventos_test -d eventos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eventos_test:eventos_test@localhost:5432/eventos_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: node --test tests/import-db.test.mjs
      - run: npm run build
