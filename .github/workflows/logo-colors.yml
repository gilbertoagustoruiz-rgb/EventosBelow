name: Colores del logo
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  logo-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/logo-colors.test.mjs
